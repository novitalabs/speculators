apiVersion: v1
kind: Pod
metadata:
  name: minimax-m2-5-eagle3-full
  labels:
    app: speculators
    task: eagle3-training
    model: minimax-m2.5
spec:
  restartPolicy: Never
  nodeName: "host-10-83-115-14"

  containers:
    - name: eagle3-trainer
      image: speculators:v0.17.0
      imagePullPolicy: IfNotPresent
      command: ["bash", "/data/run_minimax_m2.5_eagle3_train_only.sh"]

      env:
        - name: MODEL_PATH
          value: "/data/models/MiniMax-M2.5"
        - name: OUTPUT_PATH
          value: "/data/output/minimax_m2.5_eagle3"
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: NUM_GPUS
          value: "8"
        - name: HF_HOME
          value: "/data/hf_cache"
        - name: NCCL_DEBUG
          value: "WARN"
        - name: VLLM_ATTENTION_BACKEND
          value: "FLASHINFER"
        - name: VLLM_USE_V1
          value: "0"
        # Fix: host driver lib must load before stale compat lib
        - name: LD_LIBRARY_PATH
          value: "/lib/x86_64-linux-gnu:/usr/local/nvidia/lib64:/usr/local/cuda/lib64"

      resources:
        limits:
          nvidia.com/gpu: "8"
        requests:
          nvidia.com/gpu: "8"
          memory: "256Gi"
          cpu: "64"

      volumeMounts:
        - name: data-volume
          mountPath: /data
        - name: speculators-code
          mountPath: /workspace/speculators
        - name: shm
          mountPath: /dev/shm

  volumes:
    - name: data-volume
      hostPath:
        path: /data
        type: Directory
    - name: speculators-code
      hostPath:
        path: /root/develop/speculators
        type: Directory
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: "256Gi"
