apiVersion: v1
kind: Pod
metadata:
  name: minimax-m2-5-novita0320-train
  labels:
    app: speculators
    task: novita0320-train
    model: minimax-m2.5
spec:
  restartPolicy: Never
  nodeName: "host-10-83-115-10"
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

  containers:
    - name: streaming-train
      image: speculators:v0.17.0
      imagePullPolicy: IfNotPresent
      command: ["bash", "/workspace/speculators/k8s/run_minimax_m2.5_novita0320_train.sh"]

      env:
        - name: MODEL_PATH
          value: "/data/models/MiniMax-M2.5"
        - name: OUTPUT_PATH
          value: "/data/output/minimax_m2.5_eagle3_novita0320"
        - name: NUM_GPUS
          value: "8"
        - name: SEQ_LENGTH
          value: "8192"
        - name: LR
          value: "3e-5"
        - name: MIN_SAMPLES
          value: "5000"
        - name: FINAL_EPOCHS
          value: "10"
        - name: POLL_INTERVAL
          value: "30"
        - name: DATAGEN_NODE
          value: "10.83.115.28"
        - name: BUFFER_MAX_SIZE_GB
          value: "300"
        - name: OVERRIDE_NUM_ATTENTION_HEADS
          value: "24"
        - name: OVERRIDE_INTERMEDIATE_SIZE
          value: "8192"
        - name: OVERRIDE_ROPE_THETA
          value: "5000000"
        - name: DRAFT_VOCAB_SIZE
          value: "32000"
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: HF_HOME
          value: "/data/hf_cache"
        - name: NCCL_DEBUG
          value: "INFO"
        - name: NCCL_TIMEOUT
          value: "3600"
        - name: LD_LIBRARY_PATH
          value: "/lib/x86_64-linux-gnu:/usr/local/nvidia/lib64:/usr/local/cuda/lib64"

      resources:
        limits:
          nvidia.com/gpu: "8"
        requests:
          nvidia.com/gpu: "8"
          memory: "256Gi"
          cpu: "64"

      volumeMounts:
        - name: data-volume
          mountPath: /data
        - name: speculators-code
          mountPath: /workspace/speculators
        - name: shm
          mountPath: /dev/shm
        - name: ssh-keys
          mountPath: /root/.ssh
          readOnly: true

  volumes:
    - name: data-volume
      hostPath:
        path: /data
        type: Directory
    - name: speculators-code
      hostPath:
        path: /data/tengwan/develop/speculators
        type: Directory
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: "256Gi"
    - name: ssh-keys
      hostPath:
        path: /root/.ssh
        type: Directory
