apiVersion: v1
kind: Pod
metadata:
  name: minimax-m2-5-eval
  labels:
    app: speculators
    task: eagle3-eval
    model: minimax-m2.5
spec:
  restartPolicy: Never
  nodeName: "host-10-83-115-14"

  containers:
    - name: eagle3-eval
      image: speculators:v0.17.0
      imagePullPolicy: IfNotPresent
      command: ["bash", "/workspace/speculators/k8s/run_minimax_m2.5_eval.sh"]

      env:
        - name: MODEL_PATH
          value: "/data/models/MiniMax-M2.5"
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: HF_HOME
          value: "/data/hf_cache"
        - name: TP
          value: "4"
        - name: MAX_MODEL_LEN
          value: "8192"
        - name: NCCL_DEBUG
          value: "WARN"
        - name: VLLM_USE_V1
          value: "1"
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: VLLM_WORKER_MULTIPROC_METHOD
          value: "fork"
        # Fix: host driver lib must load before stale compat lib
        - name: LD_LIBRARY_PATH
          value: "/lib/x86_64-linux-gnu:/usr/local/nvidia/lib64:/usr/local/cuda/lib64"

      resources:
        limits:
          nvidia.com/gpu: "8"
        requests:
          nvidia.com/gpu: "8"
          memory: "256Gi"
          cpu: "64"

      volumeMounts:
        - name: data-volume
          mountPath: /data
        - name: speculators-code
          mountPath: /workspace/speculators
        - name: shm
          mountPath: /dev/shm

  volumes:
    - name: data-volume
      hostPath:
        path: /data
        type: Directory
    - name: speculators-code
      hostPath:
        path: /root/develop/speculators
        type: Directory
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: "256Gi"
