apiVersion: v1
kind: Pod
metadata:
  name: minimax-m2-5-eval-aurora-m25
  labels:
    app: speculators
    task: eagle3-eval-aurora-m25
spec:
  restartPolicy: Never
  nodeName: "host-10-83-115-18"
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

  containers:
    - name: eagle3-eval
      image: speculators:v0.17.0
      imagePullPolicy: IfNotPresent
      command:
        - bash
        - -c
        - |
          cd /workspace/speculators
          python3 k8s/patch_vllm_minimax_eagle3.py
          find /usr/local/lib/python3.12/dist-packages/vllm/ -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          export PYTHONDONTWRITEBYTECODE=1
          rm -rf /root/.cache/vllm/torch_compile_cache/ 2>/dev/null || true

          python3 -c "
          import json, os, time, gc

          with open('/workspace/speculators/k8s/zclawbench_prompts.json') as f:
              CHAT_PROMPTS = [p['messages'] for p in json.load(f)]
          print(f'[INFO] Loaded {len(CHAT_PROMPTS)} ZClawBench prompts')

          from vllm import LLM, SamplingParams

          llm = LLM(
              model='/data/models/MiniMax-M2.5',
              tensor_parallel_size=4,
              max_model_len=8192,
              gpu_memory_utilization=0.85,
              trust_remote_code=True,
              disable_log_stats=False,
              seed=42,
              speculative_config={
                  'model': '/data/models/Aurora-Spec-Minimax-M2.5',
                  'num_speculative_tokens': 3,
                  'method': 'eagle3',
              },
          )

          sp = SamplingParams(temperature=0.6, top_p=0.95, max_tokens=512, ignore_eos=True)
          start = time.time()
          outputs = llm.chat(CHAT_PROMPTS, sp)
          elapsed = time.time() - start
          total_tokens = sum(len(o.outputs[0].token_ids) for o in outputs)
          throughput = total_tokens / elapsed

          metrics = {
              'name': 'aurora_spec_m25',
              'total_tokens': total_tokens,
              'elapsed_seconds': round(elapsed, 2),
              'throughput_tokens_per_sec': round(throughput, 2),
              'num_prompts': len(CHAT_PROMPTS),
          }

          try:
              from vllm.v1.metrics.reader import Counter as VC, Vector
              raw = llm.get_metrics()
              nd = na = 0; ac = [0,0,0]
              for m in raw:
                  if m.name == 'vllm:spec_decode_num_drafts' and isinstance(m, VC): nd += m.value
                  elif m.name == 'vllm:spec_decode_num_accepted_tokens' and isinstance(m, VC): na += m.value
                  elif m.name == 'vllm:spec_decode_num_accepted_tokens_per_pos' and isinstance(m, Vector):
                      for i in range(min(len(m.values),3)): ac[i] += m.values[i]
              if nd > 0:
                  metrics['acceptance_length'] = round(1 + na/nd, 3)
                  for i,c in enumerate(ac):
                      metrics[f'acceptance_rate_pos_{i}'] = round(c/nd, 4)
          except Exception as e:
              print(f'WARN: {e}')

          print()
          print('===== Results: aurora_spec_m25 =====')
          for k,v in metrics.items():
              print(f'  {k}: {v}')

          os.makedirs('/data/output/minimax_m2.5_eval_exp16', exist_ok=True)
          with open('/data/output/minimax_m2.5_eval_exp16/aurora_spec_m25_results.json', 'w') as f:
              json.dump(metrics, f, indent=2)
          print('Done!')
          "

      env:
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: HF_HOME
          value: "/data/hf_cache"
        - name: NCCL_DEBUG
          value: "WARN"
        - name: LD_LIBRARY_PATH
          value: "/lib/x86_64-linux-gnu:/usr/local/nvidia/lib64:/usr/local/cuda/lib64"

      resources:
        limits:
          nvidia.com/gpu: "8"
        requests:
          nvidia.com/gpu: "8"
          memory: "256Gi"
          cpu: "64"

      volumeMounts:
        - name: data-volume
          mountPath: /data
        - name: speculators-code
          mountPath: /workspace/speculators
        - name: shm
          mountPath: /dev/shm

  volumes:
    - name: data-volume
      hostPath:
        path: /data
        type: Directory
    - name: speculators-code
      hostPath:
        path: /data/tengwan/develop/speculators
        type: Directory
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: "256Gi"
