apiVersion: v1
kind: Pod
metadata:
  name: minimax-m2-5-eval-exp16-5
  labels:
    app: speculators
    task: eagle3-eval-exp16.5
spec:
  restartPolicy: Never
  nodeName: "host-10-83-115-18"
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

  containers:
    - name: eagle3-eval
      image: speculators:v0.17.0
      imagePullPolicy: IfNotPresent
      command: ["bash", "/workspace/speculators/k8s/run_minimax_m2.5_eval_exp16.5.sh"]

      env:
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: HF_HOME
          value: "/data/hf_cache"
        - name: NCCL_DEBUG
          value: "WARN"
        - name: VLLM_USE_V1
          value: "1"
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: LD_LIBRARY_PATH
          value: "/lib/x86_64-linux-gnu:/usr/local/nvidia/lib64:/usr/local/cuda/lib64"

      resources:
        limits:
          nvidia.com/gpu: "8"
        requests:
          nvidia.com/gpu: "8"
          memory: "256Gi"
          cpu: "64"

      volumeMounts:
        - name: data-volume
          mountPath: /data
        - name: speculators-code
          mountPath: /workspace/speculators
        - name: shm
          mountPath: /dev/shm

  volumes:
    - name: data-volume
      hostPath:
        path: /data
        type: Directory
    - name: speculators-code
      hostPath:
        path: /data/tengwan/develop/speculators
        type: Directory
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: "256Gi"
