apiVersion: v1
kind: Pod
metadata:
  name: minimax-m2-5-exp20-eval
  labels:
    app: speculators
    task: exp20-eval
spec:
  restartPolicy: Never
  nodeName: "host-10-83-115-28"
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

  containers:
    - name: eval
      image: speculators:v0.17.0
      imagePullPolicy: IfNotPresent
      command:
        - bash
        - -c
        - |
          set -euo pipefail
          if ! command -v python &>/dev/null; then
            ln -s "$(command -v python3)" /usr/local/bin/python
          fi
          if ! getent hosts "$(hostname)" &>/dev/null; then
            echo "127.0.0.1 $(hostname)" >> /etc/hosts
          fi
          cd /workspace/speculators
          bash k8s/run_minimax_m2.5_exp20_eval.sh 2>&1

      env:
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: HF_HOME
          value: "/data/hf_cache"
        - name: NCCL_DEBUG
          value: "WARN"
        - name: NCCL_TIMEOUT
          value: "3600"
        - name: VLLM_ATTENTION_BACKEND
          value: "FLASH_ATTN"
        - name: LD_LIBRARY_PATH
          value: "/lib/x86_64-linux-gnu:/usr/local/nvidia/lib64:/usr/local/cuda/lib64"

      resources:
        limits:
          nvidia.com/gpu: "8"
        requests:
          nvidia.com/gpu: "8"
          memory: "256Gi"
          cpu: "64"

      volumeMounts:
        - name: data-volume
          mountPath: /data
        - name: speculators-code
          mountPath: /workspace/speculators
        - name: shm
          mountPath: /dev/shm

  volumes:
    - name: data-volume
      hostPath:
        path: /data
        type: Directory
    - name: speculators-code
      hostPath:
        path: /data/tengwan/develop/speculators
        type: Directory
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: "256Gi"
