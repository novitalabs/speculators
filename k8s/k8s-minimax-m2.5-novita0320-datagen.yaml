apiVersion: v1
kind: Pod
metadata:
  name: minimax-m2-5-novita0320-datagen
  labels:
    app: speculators
    task: novita0320-datagen
    model: minimax-m2.5
spec:
  restartPolicy: Never
  nodeName: "host-10-83-115-28"
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

  containers:
    - name: datagen
      image: speculators:v0.17.0
      imagePullPolicy: IfNotPresent
      command: ["bash", "/workspace/speculators/k8s/run_minimax_m2.5_novita0320_datagen.sh"]

      env:
        - name: MODEL_PATH
          value: "/data/models/MiniMax-M2.5"
        - name: OUTPUT_PATH
          value: "/data/output/minimax_m2.5_eagle3_novita0320"
        - name: MAX_SAMPLES
          value: "0"
        - name: SEQ_LENGTH
          value: "8192"
        - name: DATAGEN_TP
          value: "4"
        - name: DATASET_DIR
          value: "/data/datasets/novita20260320"
        - name: HF_HOME
          value: "/data/hf_cache"
        - name: VLLM_ATTENTION_BACKEND
          value: "FLASH_ATTN"
        - name: VLLM_USE_V1
          value: "0"
        - name: LD_LIBRARY_PATH
          value: "/lib/x86_64-linux-gnu:/usr/local/nvidia/lib64:/usr/local/cuda/lib64"

      resources:
        limits:
          nvidia.com/gpu: "8"
        requests:
          nvidia.com/gpu: "8"
          memory: "256Gi"
          cpu: "64"

      volumeMounts:
        - name: data-volume
          mountPath: /data
        - name: speculators-code
          mountPath: /workspace/speculators
        - name: shm
          mountPath: /dev/shm

  volumes:
    - name: data-volume
      hostPath:
        path: /data
        type: Directory
    - name: speculators-code
      hostPath:
        path: /data/tengwan/develop/speculators
        type: Directory
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: "256Gi"
