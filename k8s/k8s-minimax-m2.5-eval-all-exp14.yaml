apiVersion: v1
kind: Pod
metadata:
  name: minimax-m2-5-eval-all-exp14
  labels:
    app: speculators
    task: eagle3-eval-all-exp14
    model: minimax-m2.5
spec:
  restartPolicy: Never
  nodeName: "host-10-83-115-17"
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

  containers:
    - name: eagle3-eval-all
      image: speculators:v0.17.0
      imagePullPolicy: IfNotPresent
      command: ["bash", "/workspace/speculators/k8s/run_minimax_m2.5_eval_all_exp14_local.sh"]

      env:
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: HF_HOME
          value: "/data/hf_cache"
        - name: NUM_GPUS
          value: "8"
        - name: NCCL_DEBUG
          value: "WARN"
        - name: LD_LIBRARY_PATH
          value: "/lib/x86_64-linux-gnu:/usr/local/nvidia/lib64:/usr/local/cuda/lib64"

      resources:
        limits:
          nvidia.com/gpu: "8"
        requests:
          nvidia.com/gpu: "8"
          memory: "256Gi"
          cpu: "64"

      volumeMounts:
        - name: data-volume
          mountPath: /data
        - name: speculators-code
          mountPath: /workspace/speculators
        - name: shm
          mountPath: /dev/shm
        - name: ssh-keys
          mountPath: /root/.ssh
          readOnly: true

  volumes:
    - name: data-volume
      hostPath:
        path: /data
        type: Directory
    - name: speculators-code
      hostPath:
        path: /data/tengwan/develop/speculators
        type: Directory
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: "256Gi"
    - name: ssh-keys
      hostPath:
        path: /root/.ssh
        type: Directory
