apiVersion: v1
kind: Pod
metadata:
  name: aurora-online-datagen
  labels:
    app: speculators
    task: aurora-online-datagen
spec:
  restartPolicy: Never
  nodeName: "host-10-83-115-18"
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

  containers:
    - name: datagen
      image: speculators:v0.17.0
      imagePullPolicy: IfNotPresent
      command: ["bash", "/workspace/speculators/k8s/run_aurora_online_datagen.sh"]

      env:
        - name: AURORA_ROUND
          value: "0"
        - name: AURORA_OUTPUT_DIR
          value: "/data/output/minimax_m2.5_eagle3_aurora_online"
        - name: AURORA_FILES_PER_ROUND
          value: "2000"
        - name: AURORA_SEED_CKPT
          value: "/data/output/minimax_m2.5_eagle3_novita0320/checkpoints/67"
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: HF_HOME
          value: "/data/hf_cache"
        - name: VLLM_ATTENTION_BACKEND
          value: "FLASH_ATTN"
        - name: VLLM_USE_V1
          value: "1"
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: LD_LIBRARY_PATH
          value: "/lib/x86_64-linux-gnu:/usr/local/nvidia/lib64:/usr/local/cuda/lib64"

      resources:
        limits:
          nvidia.com/gpu: "4"
        requests:
          nvidia.com/gpu: "4"
          memory: "128Gi"
          cpu: "32"

      volumeMounts:
        - name: data-volume
          mountPath: /data
        - name: speculators-code
          mountPath: /workspace/speculators
        - name: shm
          mountPath: /dev/shm

  volumes:
    - name: data-volume
      hostPath:
        path: /data
        type: Directory
    - name: speculators-code
      hostPath:
        path: /data/tengwan/develop/speculators
        type: Directory
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: "128Gi"
