apiVersion: v1
kind: Pod
metadata:
  name: minimax-m2-5-exp23-train
  labels:
    app: speculators
    task: exp23-train
    model: minimax-m2.5
spec:
  restartPolicy: Never
  nodeName: "host-10-83-115-18"
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

  containers:
    - name: streaming-train
      image: speculators:v0.17.0
      imagePullPolicy: IfNotPresent
      command: ["bash", "/workspace/speculators/k8s/run_minimax_m2.5_exp23_train.sh"]

      env:
        - name: MODEL_PATH
          value: "/data/models/MiniMax-M2.5"
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: HF_HOME
          value: "/data/hf_cache"
        - name: NUM_GPUS
          value: "8"
        - name: NCCL_DEBUG
          value: "WARN"
        - name: LD_LIBRARY_PATH
          value: "/lib/x86_64-linux-gnu:/usr/local/nvidia/lib64:/usr/local/cuda/lib64"
        - name: DATAGEN_NODE
          value: "10.83.115.17"

      resources:
        limits:
          nvidia.com/gpu: "8"
        requests:
          nvidia.com/gpu: "8"
          memory: "256Gi"
          cpu: "64"

      volumeMounts:
        - name: data-volume
          mountPath: /data
        - name: speculators-code
          mountPath: /workspace/speculators
        - name: shm
          mountPath: /dev/shm
        - name: ssh-keys
          mountPath: /root/.ssh
          readOnly: true

  volumes:
    - name: data-volume
      hostPath:
        path: /data
        type: Directory
    - name: speculators-code
      hostPath:
        path: /data/tengwan/develop/speculators
        type: Directory
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: "256Gi"
    - name: ssh-keys
      hostPath:
        path: /root/.ssh
        type: Directory
